name: Build and verify
# Owner's zero-extra-cost policy: local verification first. Do not add automatic
# triggers or manually dispatch without explicit approval of included usage.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Rust
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
      - name: Select Rust
        run: rustup default 1.93.1
      - run: npm ci
      - name: Install dependency auditor
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Cache locked Rust dependencies for offline verification
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Run the complete verification and advisory gate
        run: npm run verify:local
