name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Rust
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
      - name: Select Rust
        run: rustup default 1.93.1
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:startup
      - run: npm run test:reading
      - run: npm audit --audit-level=high
      - name: Install dependency auditor
        run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Verify source-only repository
        run: python3 scripts/check_repository.py
